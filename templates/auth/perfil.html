{% extends 'base.html' %}
{% block title %}Meu Perfil{% endblock %}
{% block page_title %}Meu Perfil{% endblock %}
{% block content %}
<div style="max-width:480px">
<div class="panel" style="padding:24px">
  <form method="POST">
    <div class="form-group"><label>Nome</label><input type="text" name="nome" class="form-control" value="{{ current_user.nome }}" required></div>
    <div class="form-group"><label>E-mail</label><input class="form-control" value="{{ current_user.email }}" disabled></div>
    <hr style="margin:16px 0;border:none;border-top:1px solid var(--bege2)">
    <div class="form-group"><label>Senha atual</label><input type="password" name="senha_atual" class="form-control"></div>
    <div class="form-group"><label>Nova senha</label><input type="password" name="nova_senha" class="form-control"></div>
    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Salvar</button>
  </form>
</div>
</div>
{% endblock %}
